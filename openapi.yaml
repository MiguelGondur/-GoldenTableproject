openapi: 3.1.0
info:
  title: GoldenTable API
  description: 'API de reservas, fidelidad y billetera digital para casino físico.
    Autenticación con JWT: obtén el token en `POST /auth/login` y envíalo en `Authorization:
    Bearer <token>`.'
  version: 1.0.0
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Iniciar sesión y obtener un token JWT
      description: "Valida las credenciales y emite un token JWT (`Authorization:\
        \ Bearer ...`).\n\n- 401 si usuario o contraseña son incorrectos.\n- 423 si\
        \ la cuenta está bloqueada: se bloquea durante\n  `MINUTOS_BLOQUEO` minutos\
        \ tras 5 intentos fallidos consecutivos."
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '423':
          description: Cuenta bloqueada temporalmente por intentos fallidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - auth
      summary: Datos del usuario autenticado
      description: Devuelve el usuario dueño del token (sirve para validar la sesión).
      operationId: perfil_actual_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
      security:
      - HTTPBearer: []
  /usuarios/registro:
    post:
      tags:
      - usuarios
      summary: Registrar un cliente (verifica edad y documento)
      description: 'HU-10: valida la edad y el documento del usuario al registrarse.


        - 403 si es menor de 18 años: no se crea la cuenta (juego responsable).

        - 409 si el documento o el nombre de usuario ya existen.

        - 422 si el documento no tiene entre 6 y 10 dígitos u otros datos son inválidos.


        Los registros públicos siempre crean usuarios con rol `cliente`; el

        personal del casino lo crea la administración.'
      operationId: registrar_usuario_usuarios_registro_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuario'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRegistrado'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Conflicto con el estado actual del recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /usuarios/{usuario}:
    get:
      tags:
      - usuarios
      summary: Consultar un usuario
      description: Un cliente consulta su propio perfil; el personal puede consultar
        a cualquier cliente.
      operationId: consultar_usuario_usuarios__usuario__get
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario
        in: path
        required: true
        schema:
          type: string
          title: Usuario
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRegistrado'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /billetera/recarga:
    post:
      tags:
      - billetera
      summary: Recargar saldo
      description: 'HU-06: recarga el saldo de la billetera digital.


        Los montos negativos o en cero y los medios de pago no válidos se

        rechazan con 422. Un cliente autoexcluido no puede recargar (403).'
      operationId: recargar_saldo_billetera_recarga_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecargaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billetera'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /billetera/validar:
    get:
      tags:
      - billetera
      summary: Validar saldo en caja
      description: 'HU-08: valida en caja si el cliente tiene saldo suficiente para
        una

        operación con fichas por `monto_requerido`. Lo usa el cajero (o el

        gerente); un cliente solo puede validar su propio saldo.'
      operationId: validar_saldo_billetera_validar_get
      security:
      - HTTPBearer: []
      parameters:
      - name: cliente_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Código del cliente escaneado en caja (obligatorio para el personal)
          title: Cliente Id
        description: Código del cliente escaneado en caja (obligatorio para el personal)
      - name: monto_requerido
        in: query
        required: false
        schema:
          type: number
          minimum: 0.0
          description: Monto en fichas que el cajero necesita autorizar
          default: 0.0
          title: Monto Requerido
        description: Monto en fichas que el cajero necesita autorizar
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionSaldo'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /billetera/reportes:
    get:
      tags:
      - billetera
      summary: Reporte de transacciones (CSV)
      description: 'HU-12: genera un reporte exportable (CSV) de las recargas y

        transacciones, para que el gerente de operaciones audite el flujo de

        caja digital. Se puede filtrar por rango de fechas.'
      operationId: generar_reporte_billetera_reportes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: fecha_inicio
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Filtra transacciones desde esta fecha (YYYY-MM-DD)
          title: Fecha Inicio
        description: Filtra transacciones desde esta fecha (YYYY-MM-DD)
      - name: fecha_fin
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Filtra transacciones hasta esta fecha (YYYY-MM-DD)
          title: Fecha Fin
        description: Filtra transacciones hasta esta fecha (YYYY-MM-DD)
      responses:
        '200':
          description: Archivo CSV con las transacciones del periodo.
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /billetera/{cliente_id}:
    get:
      tags:
      - billetera
      summary: Saldo e historial (últimas 20 transacciones)
      description: 'HU-07: retorna el saldo actual del cliente y sus últimas 20

        transacciones, de la más reciente a la más antigua.'
      operationId: consultar_saldo_e_historial_billetera__cliente_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: cliente_id
        in: path
        required: true
        schema:
          type: string
          title: Cliente Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorialBilletera'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /fidelidad/acumular:
    post:
      tags:
      - fidelidad
      summary: Acreditar puntos por un consumo
      description: 'HU-04: la caja registra un consumo válido y se acreditan los puntos

        automáticamente (1 punto por cada $1.000). Un cliente autoexcluido no

        acumula puntos (403).'
      operationId: acumular_puntos_fidelidad_acumular_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcumularRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntosAcumulados'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /fidelidad/puntos/{cliente_id}:
    get:
      tags:
      - fidelidad
      summary: Consultar saldo de puntos
      description: Consulta el saldo de puntos del cliente (0 si aún no ha acumulado).
      operationId: consultar_puntos_fidelidad_puntos__cliente_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: cliente_id
        in: path
        required: true
        schema:
          type: string
          title: Cliente Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaldoPuntos'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /fidelidad/beneficios:
    get:
      tags:
      - fidelidad
      summary: Catálogo de beneficios
      description: Catálogo de beneficios canjeables y su costo en puntos.
      operationId: listar_beneficios_fidelidad_beneficios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: integer
                type: object
                title: Response Listar Beneficios Fidelidad Beneficios Get
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
      security:
      - HTTPBearer: []
  /fidelidad/canjear:
    post:
      tags:
      - fidelidad
      summary: Canjear puntos por un beneficio
      description: 'HU-05: canjea puntos por un beneficio del catálogo. El costo lo
        define

        el catálogo del sistema (no el cliente), se descuentan los puntos y se

        genera un cupón digital único.


        - 404 si el beneficio no existe.

        - 402 si el cliente no tiene puntos suficientes.'
      operationId: canjear_beneficio_fidelidad_canjear_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanjeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanjeConfirmado'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '402':
          description: Puntos insuficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /fidelidad/limite:
    post:
      tags:
      - fidelidad
      summary: Definir límite de gasto diario
      description: 'HU-11: el cliente define su límite de gasto diario (juego responsable).'
      operationId: definir_limite_diario_fidelidad_limite_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimiteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimiteDefinido'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /fidelidad/gasto:
    post:
      tags:
      - fidelidad
      summary: Registrar un gasto validando el límite diario
      description: 'HU-11: registra un gasto del día si no supera el límite diario
        del

        cliente. Si lo supera, responde `permitido: false` y el gasto NO queda

        registrado. Sin límite definido, el gasto siempre se permite.'
      operationId: registrar_gasto_fidelidad_gasto_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GastoRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GastoResultado'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /fidelidad/autoexclusion:
    post:
      tags:
      - fidelidad
      summary: Activar autoexclusión voluntaria
      description: 'HU-11: el cliente establece un periodo de autoexclusión. Una vez
        activo

        no se puede cancelar ni acortar: si envía un periodo más corto que el

        vigente, se conserva el más largo (sin reversión anticipada).'
      operationId: establecer_autoexclusion_fidelidad_autoexclusion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoexclusionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoexclusionConfirmada'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /fidelidad/autoexclusion/{cliente_id}:
    get:
      tags:
      - fidelidad
      summary: Consultar autoexclusión
      description: Consulta si el cliente tiene una autoexclusión vigente.
      operationId: consultar_autoexclusion_fidelidad_autoexclusion__cliente_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: cliente_id
        in: path
        required: true
        schema:
          type: string
          title: Cliente Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoAutoexclusion'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reservas:
    post:
      tags:
      - reservas
      summary: Reservar una mesa
      description: "HU-02: bloquea la mesa y devuelve un código de confirmación único.\n\
        \n- 403 si el cliente está autoexcluido.\n- 404 si la mesa no existe.\n- 409\
        \ si la mesa no está disponible a esa hora o ya fue reservada\n  para esa\
        \ fecha y hora (también ante peticiones simultáneas).\n- 422 si la fecha ya\
        \ pasó o la hora no tiene el formato HH:MM."
      operationId: crear_reserva_reservas_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          description: 'No autenticado: falta el token, es inválido o expiró.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: 'Sin permiso: rol no autorizado, cuenta de otro cliente, menor
            de edad o cliente autoexcluido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Conflicto con el estado actual del recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
