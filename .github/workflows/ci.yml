name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas y cobertura (PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goldentable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/goldentable_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas con cobertura (mínimo 80 %, REQ-NFUNC-006)
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker Compose desde cero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Todas las imágenes tienen versión explícita (sin latest)
        run: |
          if grep -nE ':latest' backend/Dockerfile frontend/Dockerfile compose.yaml; then echo "Hay imágenes con latest"; exit 1; fi
          if grep -nE '^FROM [^: ]+$' backend/Dockerfile frontend/Dockerfile; then echo "Hay FROM sin versión"; exit 1; fi
          if grep -nE '^\s*image: [^: ]+$' compose.yaml; then echo "Hay image: sin versión"; exit 1; fi
          grep -nE '^FROM|image:' backend/Dockerfile frontend/Dockerfile compose.yaml

      - name: Levantar el sistema (docker compose up -d --build)
        run: docker compose up -d --build

      - name: Esperar a que todos los servicios estén sanos
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null && curl -sf http://localhost:8080/healthz >/dev/null; then
              echo "Servicios arriba"; exit 0
            fi
            sleep 3
          done
          docker compose ps; docker compose logs --tail=80; exit 1

      - name: Ningún servicio salió con error ni se reinicia
        run: |
          docker compose ps
          test -z "$(docker compose ps --status exited --status restarting -q)"

      - name: El frontend sirve HTML y el proxy /api llega al backend
        run: |
          curl -sf http://localhost:8080/ | grep -q "GoldenTable"
          curl -sf http://localhost:8080/api/health | grep -q healthy

      - name: Recorrido completo de los flujos principales (datos de ejemplo + JWT)
        run: |
          pip install httpx==0.27.2
          python scripts/demo.py --url http://localhost:8000

      - name: Cada ruta de openapi.yaml existe en el sistema levantado
        run: |
          pip install PyYAML==6.0.2
          python scripts/check_openapi_live.py http://localhost:8000

      - name: Logs (si algo falló)
        if: failure()
        run: docker compose logs --tail=200

      - name: Apagar
        if: always()
        run: docker compose down -v
